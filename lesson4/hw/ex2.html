<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <style>
            body{
                display:flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                background-color: #f0f0f0;
                font-family: Arial, Helvetica, sans-serif;
            }
            .prd{text-align: center;
                width: 280px;
                padding: 30px 20px;
                background:linear-gradient(rgba(0,0,0,0.55), rgba(0, 0,0, 0.55)), url('https://www.invert.vn/media/uploads/uploads/2022/11/09131449-danh-lam-thang-canh-viet-nam.jpeg') center/cover;

            }
            .icon{
                width: 64px;
                height: 64px;
                background-color: white;
                border-radius: 50%;
                margin: 0 auto 12px;
                display: flex;
                font-size: 24px;
                overflow: hidden;
                
            }
            .title{
                font-size: 20px;
                margin-bottom: 8px;
                text-align: center;
                color:aliceblue
            }
            .content{
                font-size: 30;
                font-weight: bold;
                margin-bottom: 18px;
                color:aliceblue

            }
            .btn{
                display:inline-block;
                padding: 6px 20px;
                border: 2px solid white;
                border-radius: 20px;
                text-decoration: none;
                font-size: 20px;
                font-weight: bold;
                color:aliceblue
                

            }
            .prd:hover{
                background:linear-gradient(rgba(46,125,50,0.75), rgba(46, 125,50, 0.75)), url('https://www.invert.vn/media/uploads/uploads/2022/11/09131449-danh-lam-thang-canh-viet-nam.jpeg') center/cover;
            }

                
            


        </style>
</head>
<body>
    <div class="prd">
        <div class="icon"> <img src="https://png.pngtree.com/png-vector/20230223/ourlarge/pngtree-customer-service-line-icon-png-image_6616680.png"></div>
        <div class="title">Dich Vu</div>
        <div class="content">TƯ VẤN XUẤT KHẨU LAO ĐỘNG</div>
        <a href="#" class="btn">CHI TIẾT</a>

    </div>
</body>
</html>
