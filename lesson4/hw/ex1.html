<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
            margin:0;
            padding:0;
        }
        body{
            font-family:sans-serif;
            display:flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
        }
        .prd{
            position: relative;
            overflow: hidden;
            background-color: white;
            padding: 20px 15px;
            border: 2px solid #f26522;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
        }
        .tich{
            position: absolute;
            top:0;
            right: 0;
            width:26px;
            background-color: #f26522;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size:13px;
            font-weight: bold;
            border-bottom-left-radius: 8px;
            
            }
            @keyframes shakeRotate {
    0% { transform: rotate(0deg); }
    20% { transform: rotate(-15deg); }
    40% { transform: rotate(15deg); }
    60% { transform: rotate(-10deg); }
    80% { transform: rotate(10deg); }
    100% { transform: rotate(0deg); }
}
.prd:hover .tich {
    animation: shakeRotate 0.5s ease-in-out;
}
        .title{
            font-size: 14px;
            color: #555555;
            margin-bottom: 8px;
            
        }
        .price{
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="prd">
        <div class="tich"> v</div>
        <div class="title"> Macbook Air M4| core<br>GPU + 512GB</div>
        <div class="price">28.790.000 VND</div>
    </div>
</body>
</html>
