<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> DOM element : truy xuat toi the HTML thong qua cac thuoc tinh</h1>
    <hr>
    <div>
    <p id="p1">getElementbyID('p1')- noi dung cua the</p>
    <p class="p-class"> getElementsByClassName('p1-class')[0]- Noi dung cua the</p>
    </div>
    <div id="zone2">
        <h2>getElementsByTagName('h2')[0]- Noi dung tieu de 2</h2>
        <p>querySelectorAll('div#zone2 >p')[0]</p>
        <input type="text" value="manh kien" size="50">

    </div>
    <hr>
    <div id="ketQua">
        <h2>Ket qua</h2>
        <h3 id="h31"></h3>
        <h3 class="h_32"> </h3>
        <h3>
            <p></p>
        </h3>
        <h3 id="h33"></h3>
    </div>
    <script>
        //lay du lieu
        var nd_p1 = document.getElementById("p1").innerHTML;
        console.log("Noi dung phan 1:",nd_p1);
        var nd_pclass=document.getElementsByClassName('p-class')[0].innerText;
        var nd_tagName = document.getElementsByTagName("h2")[0].innerHTML;
        var nd_selector = document.querySelectorAll("#zone2 >p ")[0].innerText;
        console.log(nd_selector);

        var nd_val = document.querySelector("#zone2 >input").value;

        document.getElementById("h31").innerHTML=nd_p1;
        document.getElementsByClassName("h_32")[0].innerText=nd_pclass;
        document.querySelector("#ketQua > h3 > p").innerHTML = "<span style='color:red'>" +nd_selector +"</span>";
        document.getElementById("h33").innerHTML= nd_val;
    </script>

</body>
</html>
