<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <section>
        <h2 align="center"> <b>FORM ĐĂNG NHẬP</b></h2>
        <form action="#" method="post" >
    <table align="center" border="1" cellspacing="0" cellpadding="8" width="450px">
        <tr>
        <td>
            <label for="username"> Tên đăng nhập</label>
        </td>
        <td> 
            <input type="text" name="username" id="username" required placeholder="Nhập username" size="25">

        </td>
        </tr>
        <tr>
            <td>
                <label for="password">Mật khẩu</label>
            </td>
            <td><input type="password" name="password" id="password" required placeholder="Nhập passwords" size="25">
            </td>
        </tr>
        <tr>
            <td>
                Ghi nhớ
            </td>
            <td>
                <input type="checkbox" name="remember" id="remember">
                <label for="remember"> ghi nhớ đăng nhập</label>
            </td>
        </tr>
        <tr>
            <td colspan="2" align="center">
                <input type="submit" value="đăng nhập">
                <input type="reset" value="nhập lại">
            </td>
        </tr>
        <tr>
            <td colspan="2" align="center">
                <a href="#">Quên mật khẩu</a>| <a href="#">Đăng kí</a>
            </td>
        </tr>

    </table>
    </form>
    </section>
    
</body>
</html>
