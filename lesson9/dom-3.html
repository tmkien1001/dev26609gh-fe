<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            font-family: 'Courier New', Courier, monospace;
        }

        .clock-container {
            background: #1e293b;
            padding: 30px 50px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5),
                        inset 0 0 15px rgba(56, 189, 248, 0.1);
            border: 2px solid #334155;
            text-align: center;
        }

        #clock {
            font-size: 64px;
            font-weight: bold;
            color: #38bdf8;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
            margin: 0;
        }

        .date {
            margin-top: 8px;
            font-size: 16px;
            color: #94a3b8;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <p id="clock"></p>
    <script>
        

    function showTime(){
        let now =new Date();

        let time = now.getHours() +":"+
                    now.getMinutes() + ":" +
                    now.getSeconds();
        document.getElementById("clock").innerHTML=time;

    }
    setInterval(showTime,1000);
    </script>
    
</body>
</html>
